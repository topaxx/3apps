<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3notion</title>
<style>
:root{--bg:#fff;--side:#f7f7f5;--text:#37352f;--muted:#9b9a97;--hover:#ebebea;--active:#e3e2e0;--border:#e9e9e7;--accent:#2383e2}
body.dark{--bg:#191919;--side:#202020;--text:#e6e6e4;--muted:#7f7f7c;--hover:#2c2c2c;--active:#373737;--border:#2f2f2f;--accent:#529cca}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex}
#side{width:270px;min-width:270px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
#side header{padding:14px 12px 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;border-radius:4px;padding:3px 6px}
button:hover{background:var(--hover)}
#search{margin:4px 12px 8px;padding:6px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text)}
#tree{flex:1;overflow:auto;padding:0 6px}
.cat{margin-bottom:2px}.cathead{display:flex;align-items:center;padding:4px 6px;border-radius:4px;font-size:14px;font-weight:600;color:var(--muted)}
.cathead:hover{background:var(--hover)}.cathead .nm{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cathead .acts,.note .acts{opacity:.45}.cathead:hover .acts,.note:hover .acts{opacity:1}
.inl{flex:1;font:inherit;padding:2px 4px;border:1px solid var(--accent);border-radius:4px;background:var(--bg);color:var(--text);min-width:0}
#newNote{margin:0 12px 6px;padding:6px 8px;text-align:left;border:1px solid var(--border);background:var(--bg);border-radius:5px}
#banner{background:#fff3cd;color:#664d03;font-size:12px;padding:6px 10px;margin:0 12px 6px;border-radius:5px}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9}
#modal{background:var(--bg);color:var(--text);border-radius:8px;padding:18px;width:360px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#modal input{width:100%;padding:6px 8px;margin-top:10px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--text)}
#modal .btns{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}#modal .btns button{padding:5px 12px;border:1px solid var(--border)}
#modal .ok{background:var(--accent);color:#fff;border-color:var(--accent)!important}#modal .ok.danger{background:#e03e3e;border-color:#e03e3e!important}

.cathead.drop{outline:2px dashed var(--accent)}
.arrow{width:16px;display:inline-block;transition:transform .15s;cursor:pointer}.collapsed .arrow{transform:rotate(-90deg)}.collapsed .notes{display:none}
.note{display:flex;align-items:center;padding:4px 6px 4px 24px;border-radius:4px;font-size:14px;cursor:pointer}
.note:hover{background:var(--hover)}.note.active{background:var(--active)}.note .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts button{padding:0 4px;font-size:12px}
#side footer{border-top:1px solid var(--border);padding:8px;display:flex;flex-wrap:wrap;gap:4px;font-size:13px}
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
#toolbar{display:flex;gap:2px;padding:8px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
#toolbar button{min-width:30px;font-size:14px}#toolbar button.on{background:var(--accent);color:#fff}#toolbar select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px;margin-left:auto}
#page{flex:1;overflow:auto}#inner{max-width:760px;margin:0 auto;padding:48px 48px 120px}
#title{width:100%;font-size:38px;font-weight:700;border:none;outline:none;background:none;color:var(--text);margin-bottom:12px}
#editor{outline:none;min-height:300px;line-height:1.6;font-size:16px}
#editor:empty:before{content:attr(data-ph);color:var(--muted)}
#editor a{color:var(--accent)}#editor h1{font-size:28px}#editor h2{font-size:22px}
ul.todo{list-style:none;padding-left:4px}ul.todo>li{position:relative;padding-left:26px}
ul.todo>li:before{content:"";position:absolute;left:0;top:5px;width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;cursor:pointer}
ul.todo>li.done{text-decoration:line-through;color:var(--muted)}ul.todo>li.done:before{background:var(--accent);border-color:var(--accent)}
#editor h1,#editor h2,#editor h3{position:relative}#editor h3{font-size:18px}
#editor h1::before,#editor h2::before,#editor h3::before{content:"▼";position:absolute;left:-24px;width:20px;font-size:.5em;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:0;cursor:pointer;transition:opacity .1s}
#editor h1:hover::before,#editor h2:hover::before,#editor h3:hover::before{opacity:1}
#editor [data-collapsed="1"]::before{content:"▶";opacity:1}
#editor .hbt{display:none}
#editor img{max-width:100%;height:auto;border-radius:4px;cursor:pointer;display:block;margin:4px 0}#editor img.sel{outline:2px solid var(--accent);outline-offset:2px}
#editor.dragimg{outline:2px dashed var(--accent);outline-offset:6px}
#imgbar{position:fixed;z-index:8;background:var(--bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.15);padding:3px;display:flex;gap:2px}
#imgbar button{font-size:12px}#imgbar button.on{background:var(--accent);color:#fff}
.note.dBefore{box-shadow:inset 0 2px 0 var(--accent)}.note.dAfter{box-shadow:inset 0 -2px 0 var(--accent)}
.cat.dBefore>.cathead{box-shadow:inset 0 2px 0 var(--accent)}.cat.dAfter>.cathead{box-shadow:inset 0 -2px 0 var(--accent)}
.cathead[draggable=true]{cursor:grab}
#editor{overflow-x:auto;padding:0 2px 24px 30px;margin-left:-30px}
#editor table{border-collapse:collapse;table-layout:fixed;margin:10px 0}
#editor td,#editor th{border:1px solid var(--border);padding:6px 8px;vertical-align:top;min-width:40px;overflow-wrap:anywhere;text-align:left}
#editor th{background:var(--side);font-weight:600}#editor td>p,#editor th>p{margin:0}
#editor td.tsel,#editor th.tsel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tui{position:fixed;z-index:7;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;user-select:none;padding:0}
.tui:hover{background:var(--hover);color:var(--text)}.tui.plus{font-size:14px;opacity:.7}
.tgrip{position:fixed;z-index:7;width:7px;cursor:col-resize;background:transparent}.tgrip:hover,.tgrip.on{background:var(--accent);opacity:.5}
#tmenu{position:fixed;z-index:9;background:var(--bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px;min-width:210px;max-height:80vh;overflow:auto}
#tmenu button{display:block;width:100%;text-align:left;padding:5px 10px;font-size:13px}#tmenu hr{border:none;border-top:1px solid var(--border);margin:4px 0}
#tmenu .danger{color:#e03e3e}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#37352f;color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:20}#toast.show{opacity:1;transform:translateX(-50%)}body.dark #toast{background:#e6e6e4;color:#191919}
mark{border-radius:3px;padding:0 1px;color:inherit}
mark.hl-yellow{background:#fbf3a5}mark.hl-green{background:#cdeec8}mark.hl-blue{background:#cfe3fb}mark.hl-pink{background:#f8d3e6}mark.hl-orange{background:#fbdcbf}
body.dark mark.hl-yellow{background:#6b5d12}body.dark mark.hl-green{background:#2e5a32}body.dark mark.hl-blue{background:#28476d}body.dark mark.hl-pink{background:#6b2f4f}body.dark mark.hl-orange{background:#73431c}
#hlWrap{position:relative;display:inline-flex}#hlDrop{min-width:16px!important;padding:3px 2px}
#hlMenu{position:absolute;top:100%;left:0;z-index:9;background:var(--bg);border:1px solid var(--border);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px;min-width:170px}
#hlMenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;font-size:13px}#hlMenu .sw{width:14px;height:14px;border-radius:3px;border:1px solid var(--border)}#hlMenu button.cur{font-weight:600}
ul.toggle{list-style:none;padding-left:4px}ul.toggle>li{position:relative;padding-left:24px}
ul.toggle>li::before{content:"▼";position:absolute;left:2px;top:.35em;font-size:.7em;color:var(--muted);cursor:pointer;width:16px;text-align:center}
ul.toggle>li[data-collapsed="1"]::before{content:"▶"}
ul.toggle>li[data-collapsed="1"]>:is(ul,ol,p,div,table,h1,h2,h3){display:none}
#empty{color:var(--muted);text-align:center;margin-top:30vh}
#status{font-size:12px;color:var(--muted);margin-left:8px}
</style></head><body>
<aside id="side"><header><span>📝 3notion</span><button id="addCat" title="New category">＋ Category</button></header>
<div id="banner" hidden></div><button id="newNote" title="New note (Alt+N)">＋ New note</button><input id="search" placeholder="Search…"><div id="tree"></div>
<footer><button id="exp">⬇ Export</button><button id="imp">⬆ Import</button><button id="theme">🌙 Dark</button><input type="file" id="file" accept=".json,application/json" hidden></footer></aside>
<main id="main"><div id="toolbar">
<button data-c="bold" title="Bold (Ctrl+B)"><b>B</b></button><button data-c="italic" title="Italic (Ctrl+I)"><i>I</i></button><button data-c="underline" title="Underline (Ctrl+U)"><u>U</u></button>
<button data-b="H1" title="Heading 1 (Ctrl+1 or Ctrl+Shift+1)">H1</button><button data-b="H2" title="Heading 2 (Ctrl+2 or Ctrl+Shift+2)">H2</button><button data-b="H3" title="Heading 3 (Ctrl+3 or Ctrl+Shift+3)">H3</button><button data-b="P" title="Normal text (Ctrl+0 or Ctrl+Shift+0)">¶</button>
<button data-c="insertUnorderedList" title="Bulleted list (Ctrl+L or Ctrl+Shift+8)">• List</button><button data-c="insertOrderedList" title="Numbered list (Ctrl+Shift+L or Ctrl+Shift+7)">1. List</button>
<button id="toggleBtn" title="Toggle list (type &quot;&gt; &quot; at line start)">▸ Toggle</button><button id="todoBtn" title="To-do list (Ctrl+Shift+9)">☑ To-do</button><button id="imgBtn" title="Insert image (or paste/drag an image)">🖼 Image</button><input type="file" id="imgFile" accept="image/*" multiple hidden><button id="tblBtn" title="Insert table (3×3)">▦ Table</button><span id="hlWrap"><button id="hlBtn" title="Highlight (Ctrl+Shift+H)">🖍 Highlight</button><button id="hlDrop" title="Highlight color">▾</button><div id="hlMenu" hidden></div></span><button id="linkBtn" title="Insert link (Ctrl+K)">🔗 Link</button><span id="status"></span>
<select id="moveSel" title="Move to"></select></div>
<div id="page"><div id="inner"><div id="empty">Select or create a note</div>
<div id="noteView" hidden><input id="title" placeholder="Untitled"><div id="editor" contenteditable="true" data-ph="Start typing… (tip: # , ## , - , 1. , [] )"></div></div></div></div></main>
<div id="imgbar" hidden><button data-w="25">25%</button><button data-w="50">50%</button><button data-w="75">75%</button><button data-w="100">100%</button><button data-del="1" title="Delete image">🗑</button></div>
<div id="tblui" hidden><div class="tui" id="tRowH" title="Row options">⋮⋮</div><div class="tui" id="tColH" title="Column options">⋮⋮</div><div class="tui plus" id="tAddR" title="Add row">＋</div><div class="tui plus" id="tAddC" title="Add column">＋</div><div id="tGrips"></div></div><div id="tmenu" hidden></div>
<div id="modalBg" hidden><div id="modal"><div id="mMsg"></div><input id="mIn"><div class="btns"><button id="mCancel">Cancel</button><button id="mOk" class="ok">OK</button></div></div></div>
<script>
const KEY='notities-app-v1';const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let mode='mem',idb=null,memMode=false;
const MSG={mem:'⚠ Storage blocked: notes will not be kept after closing. Use Export, or open the file directly in your browser.',quota:'⚠ Storage is full: your latest changes were not saved. Export a backup and delete or shrink large images.'};
function setBanner(k){const b=document.getElementById('banner');b.hidden=!k;if(k)b.textContent=MSG[k]}
function lsGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function idbOpen(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('notities-app',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})}
function idbReq(m,...a){return new Promise((res,rej)=>{try{const t=idb.transaction('kv',m==='get'?'readonly':'readwrite');const r=t.objectStore('kv')[m](...a);t.oncomplete=()=>res(r.result);t.onerror=t.onabort=()=>rej(t.error||r.error)}catch(e){rej(e)}})}
async function loadData(){let v=null;
 try{idb=await idbOpen();mode='idb';v=await idbReq('get',KEY);
  if(v==null){const ls=lsGet();if(ls){await idbReq('put',ls,KEY);v=ls;try{localStorage.removeItem(KEY);localStorage.setItem(KEY+'-backup-voor-migratie',ls)}catch(e){}}}}
 catch(e){idb=null;try{localStorage.setItem(KEY+'-test','1');localStorage.removeItem(KEY+'-test');mode='ls';v=lsGet()}catch(e2){mode='mem'}}
 memMode=mode==='mem';setBanner(memMode?'mem':null);try{return JSON.parse(v||'null')}catch(e){return null}}
let dirty=false;
function flush(){if(!dirty)return;dirty=false;const v=JSON.stringify(D);
 if(mode==='idb')idbReq('put',v,KEY).then(()=>{if(!memMode)setBanner(null)}).catch(e=>{setBanner('quota')});
 else if(mode==='ls'){try{localStorage.setItem(KEY,v);setBanner(null)}catch(e){setBanner(/quota/i.test(e.name+e.message)?'quota':'mem')}}}
function lsSet(){dirty=true;flush()}
let D={cats:[{id:uid(),name:'General',collapsed:false}],notes:[],current:null,dark:false};
function save(){dirty=true;clearTimeout(save.p);save.p=setTimeout(flush,300);$('#status').textContent='Saved';clearTimeout(save.t);save.t=setTimeout(()=>$('#status').textContent='',1200)}
const cur=()=>D.notes.find(n=>n.id===D.current);
function ask(msg,o={}){return new Promise(res=>{const bg=$('#modalBg'),inp=$('#mIn'),ok=$('#mOk');$('#mMsg').textContent=msg;inp.hidden=!o.input;inp.value=o.def||'';ok.textContent=o.ok||'OK';ok.classList.toggle('danger',!!o.danger);bg.hidden=false;(o.input?inp:ok).focus();
 const done=v=>{bg.hidden=true;ok.onclick=$('#mCancel').onclick=inp.onkeydown=bg.onkeydown=null;res(v)};
 ok.onclick=()=>done(o.input?inp.value:true);$('#mCancel').onclick=()=>done(o.input?null:false);
 bg.onkeydown=e=>{if(e.key==='Escape')done(o.input?null:false);if(e.key==='Enter'){e.preventDefault();ok.click()}}})}
let editing=null;
function inline(span,val,cb){const i=document.createElement('input');i.className='inl';i.value=val;span.replaceWith(i);i.focus();i.select();let fin=false;
 const end=ok=>{if(fin)return;fin=true;editing=null;cb(ok?i.value.trim():null)};
 i.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();end(true)}if(e.key==='Escape')e.preventDefault();if(e.key==='Escape')end(false)};i.onblur=()=>end(true);i.onclick=e=>e.stopPropagation()}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.code==='KeyS'){e.preventDefault();e.stopPropagation();const n=cur();if(n&&document.activeElement===ed){n.html=ed.innerHTML.replace(/ class="tsel"/g,'');dirty=true}dirty=true;flush();toast('No need to save. Every change is saved automatically.')}},true);
let freshCat=null;const SH={past:[],future:[]};
function snapSide(){return {cats:D.cats.map(c=>({...c})),notes:D.notes.map(n=>({ref:n,cat:n.cat,title:n.title})),current:D.current}}
function sideAct(label){SH.past.push({snap:snapSide(),label});if(SH.past.length>50)SH.past.shift();SH.future=[]}
function restoreSide(sn){const n0=cur();if(n0&&document.activeElement===ed){n0.html=ed.innerHTML}
 D.cats=sn.cats.map(c=>({...c}));D.notes=sn.notes.map(x=>{x.ref.cat=x.cat;x.ref.title=x.title;return x.ref});
 D.current=D.notes.some(n=>n.id===sn.current)?sn.current:(cur()?D.current:null);if(document.activeElement===ed)ed.blur();save();render();open()}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=msg;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2200)}
function sideUndo(){const a=SH.past.pop();if(!a){toast('Nothing to undo');return}SH.future.push({snap:snapSide(),label:a.label});restoreSide(a.snap);toast('Undone: '+a.label)}
function sideRedo(){const a=SH.future.pop();if(!a){toast('Nothing to redo');return}SH.past.push({snap:snapSide(),label:a.label});restoreSide(a.snap);toast('Redone: '+a.label)}
let drag=null;function clearDrop(){document.querySelectorAll('.dBefore,.dAfter,.drop').forEach(x=>x.classList.remove('dBefore','dAfter','drop'))}
let pend=null,editingNote=null;function render(){const q=$('#search').value.toLowerCase().trim(),t=$('#tree');t.innerHTML='';
 D.cats.forEach(c=>{const ns=D.notes.filter(n=>n.cat===c.id&&(!q||(n.title+' '+n.html.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q)));
  if(q&&!ns.length)return;const el=document.createElement('div');el.className='cat'+(c.collapsed&&!q?' collapsed':'');
  el.innerHTML=`<div class="cathead"><span class="arrow">▾</span><span class="nm">${esc(c.name)}</span><span class="acts"><button data-a="addn" title="New note">＋</button><button data-a="ren" title="Rename">✎</button><button data-a="del" title="Delete">🗑</button></span></div><div class="notes"></div>`;
  const h=el.firstChild;h.querySelector('.arrow').onclick=h.querySelector('.nm').onclick=()=>{c.collapsed=!c.collapsed;save();render()};
  h.querySelector('[data-a=addn]').onclick=()=>newNote(c.id);
  const renC=()=>inline(h.querySelector('.nm'),c.name,v=>{if(v&&v!==c.name){if(freshCat!==c.id)sideAct('category renamed');c.name=v}freshCat=null;save();render()});h.querySelector('[data-a=ren]').onclick=renC;h.querySelector('.nm').ondblclick=renC;if(editing===c.id)pend=renC;
  h.querySelector('[data-a=del]').onclick=()=>{const k=D.notes.filter(n=>n.cat===c.id).length;ask(`Delete category "${c.name}"${k?` including ${k} note(s)`:''}?`,{ok:'Delete',danger:true}).then(y=>{if(y){sideAct('category deleted');D.notes=D.notes.filter(n=>n.cat!==c.id);D.cats=D.cats.filter(x=>x!==c);if(!cur())D.current=null;save();render();open()}})};
  h.draggable=!q;h.ondragstart=e=>{if(e.target.closest('input')){e.preventDefault();return}drag={t:'cat',id:c.id};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','cat:'+c.id)};h.ondragend=clearDrop;
  h.ondragover=e=>{if(!drag)return;e.preventDefault();clearDrop();if(drag.t==='note')h.classList.add('drop');else if(drag.id!==c.id){const rc=h.getBoundingClientRect();el.classList.add(e.clientY<rc.top+rc.height/2?'dBefore':'dAfter')}};
  h.ondragleave=()=>{h.classList.remove('drop');el.classList.remove('dBefore','dAfter')};
  h.ondrop=e=>{e.preventDefault();const d=drag;const after=el.classList.contains('dAfter');clearDrop();drag=null;if(!d)return;
   if(d.t==='note'){const n=D.notes.find(x=>x.id===d.id);if(n){sideAct('note moved');D.notes.splice(D.notes.indexOf(n),1);n.cat=c.id;D.notes.push(n);c.collapsed=false}}
   else if(d.id!==c.id){sideAct('category moved');const mv=D.cats.find(x=>x.id===d.id);D.cats.splice(D.cats.indexOf(mv),1);D.cats.splice(D.cats.indexOf(c)+(after?1:0),0,mv)}save();render();open()};
  ns.forEach(n=>{const ne=document.createElement('div');ne.className='note'+(n.id===D.current?' active':'');ne.draggable=true;
   ne.innerHTML=`<span class="nm">📄 ${esc(n.title||'Untitled')}</span><span class="acts"><button data-a="ren" title="Rename">✎</button><button data-a="del" title="Delete">🗑</button></span>`;
   ne.onclick=e=>{if(e.target.closest('button'))return;D.current=n.id;save();render();open()};
   ne.ondragstart=e=>{e.stopPropagation();drag={t:'note',id:n.id};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','note:'+n.id)};ne.ondragend=clearDrop;
   ne.ondragover=e=>{if(!drag||drag.t!=='note'||drag.id===n.id)return;e.preventDefault();e.stopPropagation();clearDrop();const rc=ne.getBoundingClientRect();ne.classList.add(e.clientY<rc.top+rc.height/2?'dBefore':'dAfter')};
   ne.ondragleave=()=>ne.classList.remove('dBefore','dAfter');
